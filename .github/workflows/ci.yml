name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and start both planes
        run: docker compose up -d --build
      - name: Wait for liveness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3901/healthz >/dev/null && curl -fsS http://127.0.0.1:3902/healthz >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Full upload, extraction, duplicate, handoff and download flow
        run: npm run smoke:seed
      - name: Restart both planes
        run: docker compose restart file-control file-data
      - name: Wait after restart
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3901/healthz >/dev/null && curl -fsS http://127.0.0.1:3902/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Verify SQLite, bytes, jobs and results persisted across restart
        run: npm run smoke:verify
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
