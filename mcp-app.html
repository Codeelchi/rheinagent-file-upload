<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>RheinAgent Dokument-Workbench</title>
    <style>
      :root {
        --ra-blue: #0045b9;
        --ra-green: #26ba18;
        --ra-navy: #071a2b;
        --ra-slate: #536171;
        --ra-mist: #f3f7fa;
        --ra-light: #e8eef5;
        --ra-white: #ffffff;
        --ra-black: #111827;
        --ra-font-heading: "Manrope", "Inter", Arial, sans-serif;
        --ra-font-body: "Inter", Arial, Helvetica, sans-serif;
        --ra-radius: 4px;
        --ra-space: 8px;
      }
      body {
        font-family: var(--ra-font-body);
        color: var(--ra-black);
        background: var(--ra-white);
        padding: calc(var(--ra-space) * 2);
        max-width: 460px;
      }
      header {
        display: flex;
        align-items: center;
        gap: var(--ra-space);
        margin-bottom: calc(var(--ra-space) * 1.5);
      }
      header img {
        width: 32px;
        height: 32px;
      }
      h2 {
        font-family: var(--ra-font-heading);
        font-weight: 700;
        font-size: 1rem;
        margin: 0;
        color: var(--ra-navy);
      }
      #drop {
        border: 2px dashed var(--ra-slate);
        border-radius: var(--ra-radius);
        padding: calc(var(--ra-space) * 2.5) var(--ra-space);
        text-align: center;
        color: var(--ra-slate);
        cursor: pointer;
        font-size: 0.9rem;
        transition: border-color 0.15s, color 0.15s;
      }
      #drop.dragover {
        border-color: var(--ra-blue);
        color: var(--ra-blue);
        background: var(--ra-mist);
      }
      input[type="file"] {
        display: none;
      }
      #status {
        margin-top: var(--ra-space);
        font-size: 0.85rem;
        color: var(--ra-slate);
        white-space: pre-wrap;
      }
      #doclist {
        margin-top: calc(var(--ra-space) * 1.5);
        border-top: 1px solid var(--ra-light);
        padding-top: var(--ra-space);
      }
      .doc-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: calc(var(--ra-space) * 0.6) 0;
        font-size: 0.85rem;
        border-bottom: 1px solid var(--ra-light);
      }
      .doc-row .doc-actions button {
        font-size: 0.72rem;
        padding: 0.2rem 0.5rem;
        margin-left: 0.3rem;
        border: 1px solid var(--ra-light);
        border-radius: var(--ra-radius);
        background: var(--ra-white);
        color: var(--ra-navy);
        cursor: pointer;
      }
      .doc-row .doc-actions button:hover {
        border-color: var(--ra-blue);
        color: var(--ra-blue);
      }
      .doc-row .doc-actions button.danger:hover {
        border-color: #c62828;
        color: #c62828;
      }
      #viewer {
        margin-top: calc(var(--ra-space) * 1.5);
        border-top: 1px solid var(--ra-light);
        padding-top: var(--ra-space);
        display: none;
      }
      #viewer-title {
        font-family: var(--ra-font-heading);
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: calc(var(--ra-space) * 0.5);
        color: var(--ra-navy);
      }
      #viewer-content {
        white-space: pre-wrap;
        font-size: 0.8rem;
        background: var(--ra-mist);
        border-radius: var(--ra-radius);
        padding: calc(var(--ra-space) * 0.75);
        max-height: 220px;
        overflow-y: auto;
        color: var(--ra-black);
      }
      #viewer-actions {
        margin-top: calc(var(--ra-space) * 0.75);
        display: flex;
        gap: var(--ra-space);
      }
      #viewer-actions button {
        font-size: 0.8rem;
        padding: 0.3rem 0.7rem;
        border-radius: var(--ra-radius);
        border: none;
        cursor: pointer;
        color: var(--ra-white);
      }
      #download-btn {
        background: var(--ra-blue);
      }
      #summarize-btn {
        background: var(--ra-green);
      }
    </style>
  </head>
